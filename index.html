<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080B10" media="(prefers-color-scheme: dark)" />

    <title>Ledger — Free Invoice Generator | Create & Download PDF Invoices</title>
    <meta
      name="description"
      content="Build professional invoices in your browser. Multi-currency, multi-tax, seven templates, live preview, PDF export and print. Nothing leaves your device."
    />
    <meta name="author" content="Ledger" />
    <meta
      name="keywords"
      content="invoice generator, free invoice maker, pdf invoice, billing, freelance invoice, VAT invoice, GST invoice, receipt generator"
    />
    <link rel="canonical" href="https://ledger-invoice.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ledger" />
    <meta property="og:title" content="Ledger — Free Invoice Generator" />
    <meta
      property="og:description"
      content="Build professional invoices in your browser. Multi-currency, multi-tax, seven templates, live preview, PDF export and print."
    />
    <meta property="og:url" content="https://ledger-invoice.app/" />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ledger — Free Invoice Generator" />
    <meta
      name="twitter:description"
      content="Build professional invoices in your browser. Multi-currency, multi-tax, seven templates, live preview, PDF export and print."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: preconnect then load with display=swap so first paint is never blocked -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ledger",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "description": "A browser-based invoice generator with live preview, multi-currency and multi-tax support, seven templates, PDF export and printing. All data stays on the user's device.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Live invoice preview",
          "Seven invoice templates",
          "Multi-currency support",
          "Multiple taxes, VAT and GST",
          "Line-item and invoice-level discounts",
          "PDF export and printing",
          "Local invoice history with autosave"
        ]
      }
    </script>

    <!-- Apply the stored theme before first paint so the page never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ledger.theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          root.style.colorScheme = mode;
        } catch (e) {
          /* localStorage unavailable — fall back to the default light class */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" data-print-path></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 3rem; max-width: 40rem; margin: auto">
        <h1>Ledger needs JavaScript</h1>
        <p>
          This invoice generator runs entirely in your browser — there is no server to fall back to.
          Enable JavaScript to build, preview and export invoices.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
